<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Home Work </title>
	<style>
		#td
		{
			font-size: 80px;
			color: black;
			background: skyblue;
			font-family: 'Times Roman';
			text-align: center;
		}
		#td1
		{
			font-size: 80px;
			font-weight: bold;
			color: white;
			text-shadow: 5px 5px 5px black;
			background: skyblue;
			font-family: 'Times Roman';
			text-align: center;

		}
		#td2
		{
			font-size: 80px;
			font-weight: bold;
			color: red;
			/*text-wrap-style: 2px white;*/
			text-shadow: 3px 3px 5px black;
			-webkit-text-stroke:2px white;
			background: skyblue;
			font-family: 'Times Roman';
			text-align: center;
		}
		div
		{
			height: 250px;
			width: 300px;
			border: 7px outset orange;
			background:purple;
			margin-top: 20px;
		}
		#circle
		{
			height:150px;
			width: 190px;
			border: 5px double orange;
			background: purple;
			border-radius: 50px 50px 50px 50px;
			margin-top: 20px;
			margin: 50px;
		}
		#circle1
		{
			height:180px;
			width: 220px;
			border: 6px groove orange;
			background: purple;
			border-radius: 250px 250px 250px 250px;
			margin-top: 20px;
			margin: 50px;
		}
		#halfcircle
		{
		
			height:300px;
			width: 300px;
			border: 6px outset orange;
			background: purple;
			border-top-left-radius: 150px;
			border-bottom-left-radius: 0px;
			border-top-right-radius: 150px;
			border-bottom-right-radius: 0px;
			margin-top: 20px;
		}
		#div
		{
			height: 250px;
			width: 300px;
			border: 7px outset orange;
			background:purple;
			border-radius: 50px;
			border-bottom-left-radius: 5px;
			border-top-right-radius: 5px;
			margin-top: 20px;
		}
		#patti
		{
			height:180px;
			width: 200px;
			border: 5px outset orange;
			background: purple;
			border-radius: 250px 5px 250px;
			margin-top: 20px;
			margin: 5px;
		}
		#chap
		{
			height:300px;
			width: 400px;
			border: 9px outset orange;
			background: purple;
			border-top-left-radius: 350px ;
			border-top-right-radius: 5px ;
			border-bottom-right-radius: 5px ;
			border-bottom-left-radius:0px ;
			margin: 5px;
			margin-top: 20px;		
		}
		#div1
		{
			height: 250px;
			width: 300px;
			border: 7px outset orange;
			background:purple;
			border-radius: 50px;
			margin-top: 20px;
		}
	</style>
</head>
<body>
	<table>
		<tr>
			<td id="td" colspan="2">Hardik Prajapati</td>
			<td id="td1">CSS</td>
			<td id="td2">Border radius</td>
		</tr>
	<tr>
<td><div></div></td>
<td><div id="circle"></div></td>
<td><div id="circle1"></div></td>
<td><div id="halfcircle"></div></td>
	</tr>
	<tr>
<td><div id="div"></div> </td>
<td><div id="patti"></div></td>
<td><div id="chap"></div></td>
<td><div id="div1"></div> </td>
	</tr>
</table>
</body>
</html>
