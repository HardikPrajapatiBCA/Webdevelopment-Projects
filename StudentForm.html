<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Student Registation Form</title>
</head>
<body>
<form>
	<table bgcolor="pink" width="100" height="250" align="center">
		<tr>
			<td colspan="5"><center><b> Student Registration Form</b></center> </td>
		</tr>
		<tr>
			<td> Roll no: </td>
			<td colspan="5"><input type="text" name="" placeholder="Enter your Roll number"> </td>
		</tr>
	<tr>
		<td>Student name::</td>
		<td><input type="text" name="" placeholder="First name"> 
		</td>
		<td colspan="4"><input type="text" name="" placeholder="Last name"></td>
	</tr>
	<tr>
		<td>Father's name:: </td>
		<td colspan="5"><input type="text" name=""> </td>
	</tr>
	<tr>
		<td>Date of Birth ::</td>
		<td ><input type="text" name="" placeholder="day"> - </td>
		<td ><input type="text" name="" placeholder="month"> - </td>
		<td colspan="3"><input type="text" name="" placeholder="Year">(DD-MM-YYYY)</td>
	</tr>
	<tr> 
		<td>Mobile NO::</td>
		<td ><input type="number" name="" placeholder="+91" min="0" max="0"></td>
		<td colspan="4"><input type="text" name=""></td>
	</tr>
	<tr>
		<td>Email id::</td>
		<td colspan="5"><input type="email" name=""> </td>
	</tr>
	<tr>
		<td>Password::</td>
		<td colspan="5"><input type="Password" name=""> </td>
	</tr>
	<tr>
		<td>Gender::</td>
		<td><input type="radio" name="gender" >Male </td>
		<td colspan="4"><input type="radio" name="gender">Female </td>
	</tr>
	<tr>
		<td> Department ::</td>
		<td><input type="checkbox" name="">CSE </td>
		<td><input type="checkbox" name="">IT</td>
		<td><input type="checkbox" name="">ECE </td>
		<td><input type="checkbox" name="">Civil </td>
		<td><input type="checkbox" name="">Mech</td>
	</tr>
	<tr>
		<td>Course::</td>
		<td colspan="5"><select>
			<option>--------Select Courses ------------</option>
			<option>BCA</option>
			<option>BA</option>
			<option>BSC</option>
		</select> </td>
	</tr>
	<tr>
		<td> Student photo ::</td>
		<td colspan="5"><input type="file" name=""> </td>
	</tr>
	<tr>
		<td>City::</td>
		<td colspan="5"><input type="text" name=""> </td>
	</tr>
	<tr>
		<td>Address ::</td>
		<td colspan="5"><textarea rows="5" cols="60">
		</textarea> </td>
	</tr>
	<tr>
		<td colspan="5"><center><input type="Submit" name="" value="Register"></center> </td>
	</tr>
	</table>
</form>
</body>
</html>
